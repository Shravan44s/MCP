name: Auto-Post Meme Reel

# Runs the whole "pick a fresh trending meme -> video -> caption -> post to
# Instagram Reels" pipeline directly on the runner (no Vercel serverless
# timeout to worry about), twice a day, and commits the updated no-repeat
# ledger back to the repo.
#
# Scheduled runs always publish for real. Manual runs (workflow_dispatch)
# default to --dry-run so you can sanity-check the pick before trusting it.

on:
  schedule:
    # 04:00 UTC / 14:00 UTC = ~09:30 / ~19:30 IST
    - cron: "0 4 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log the pick, skip publishing + ledger commit)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  auto-post:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Run auto-post pipeline
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npx tsx scripts/auto-post.ts --dry-run
          else
            npx tsx scripts/auto-post.ts
          fi
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          IMGFLIP_USERNAME: ${{ secrets.IMGFLIP_USERNAME }}
          IMGFLIP_PASSWORD: ${{ secrets.IMGFLIP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit updated meme ledger
        if: env.DRY_RUN != 'true'
        run: |
          if ! git diff --quiet -- data/posted-memes.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/posted-memes.json
            git commit -m "chore: update meme ledger [skip ci]"
            git push
          else
            echo "Ledger unchanged, nothing to commit."
          fi
